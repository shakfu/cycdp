[project]
name = "cycdp"
version = "0.2.0"
description = "Cython bindings for the CDP audio processing library"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["audio", "dsp", "signal-processing", "spectral", "granular", "cython", "cdp"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.scripts]
cycdp = "cycdp.cli:main"

[project.urls]
Homepage = "https://github.com/shakfu/cycdp"
Repository = "https://github.com/shakfu/cycdp"
Issues = "https://github.com/shakfu/cycdp/issues"
Changelog = "https://github.com/shakfu/cycdp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # cython is a build requirement, but coverage.py needs it importable at
    # test time too: Cython.Coverage is the plugin that maps _core.pyx lines.
    "cython>=3.0",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "twine>=6.2.0",
]

[build-system]
requires = ["scikit-build-core>=0.8", "cython"]
build-backend = "scikit_build_core.build"

# Coverage only sees the Cython extension when it was built with line tracing.
# Always measure via `make coverage`, which rebuilds with CYCDP_COVERAGE=ON.
# Running --cov against an ordinary build silently omits _core.pyx -- 6,400
# lines, the whole library -- while still printing a confident total that
# describes only cli.py. tests/test_coverage_setup.py fails when that happens
# rather than letting the misleading number through.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unregistered mark or an unknown config key rather than silently
# ignoring it, and treat warnings as errors so deprecations are not accumulated
# silently across Cython/CPython upgrades.
addopts = "--strict-markers --strict-config"
markers = [
    # Wall-clock sensitive. Deselected for cibuildwheel's wheel smoke-test,
    # which runs under emulation on shared runners where timing is meaningless.
    "timing: measures elapsed time or throughput",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9/F): import sorting, bugbear, comprehensions,
# pyupgrade, and flagging bare excepts and unused arguments.
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM108",  # ternaries are not always clearer than if/else
    # __all__ is grouped by category with section comments, which is far more
    # readable for ~150 exports than one alphabetical run.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately exec README snippets and assert on broad exception types.
# B007/RUF059: unpacking a full tuple return and using part of it reads better
# in a test than underscore-prefixing, and naming the discarded field documents
# what the API returns.
"tests/*" = ["B011", "S101", "B007", "RUF059"]
# The re-export block is grouped by category with section comments mirroring
# __all__. Alphabetising it detaches every comment from its entries.
"src/cycdp/__init__.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# The compiled extension is described by _core.pyi, which is generated; the
# module itself has no Python source for mypy to follow.
module = "cycdp._core"
ignore_missing_imports = true

[tool.coverage.run]
plugins = ["Cython.Coverage"]
branch = true
source = ["src/cycdp"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.paths]
# Map the installed copy back onto the source tree so line data merges.
source = ["src/cycdp", "**/site-packages/cycdp"]

[tool.scikit-build]
wheel.packages = ["src/cycdp"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
sdist.include = [
    "projects/libcdp/src/**",
    "projects/libcdp/cdp_lib/**",
    "projects/libcdp/include/**",
    "projects/cpd8/dev/pv/mxfft.c",
    "projects/cpd8/dev/newinclude/**",
    "projects/cpd8/dev/include/**",
]
sdist.exclude = [
    "**/*.zip",
    "**/*.wav",
    "**/build/**",
    "**/__pycache__/**",
]
wheel.exclude = [
    "*.pxd",
    "*.pyx",
]

