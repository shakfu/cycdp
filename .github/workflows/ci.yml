

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Check type stubs are up to date
        run: uv run python scripts/gen_stubs.py --check

      # A public function whose float parameter reaches C unguarded is a crash
      # waiting to be reported by someone else: NaN passes every
      # comparison-based clamp in the C layer and `(size_t)nan` is undefined
      # behaviour. The existing operations would all still pass without this,
      # so the check exists to catch the *next* one added.
      - name: Check every float parameter is validated
        run: uv run python scripts/check_validation.py

      - name: Type check with mypy
        run: uv run mypy src/cycdp/ tests/ --exclude '.venv'

      - name: Run tests
        run: uv run pytest tests/ -v

      # The C library was compiled at the compiler's defaults for a long time
      # while only the Cython extension got -Wall -Wextra -- 23,000 lines,
      # including every function that produced a crash, with warnings off.
      # They are on for all targets now; this keeps them at zero. Scoped to the
      # hand-written sources: mxfft.c is vendored and _core.c is generated.
      - name: Build the C library with -Werror
        run: |
          cmake -S . -B build/werror \
            -DPython_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')" \
            -DCYCDP_WERROR=ON
          cmake --build build/werror --target cdp cdp_lib -j"$(nproc)"

  coverage:
    name: Coverage (with Cython line tracing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The extension must be rebuilt with CYCDP_COVERAGE=ON or coverage cannot
      # see _core.pyx -- 6,400 lines, the whole library -- and reports a
      # confident total describing only cli.py. --no-cache because uv keys its
      # build cache on source content, not the environment, and would otherwise
      # return a non-instrumented wheel.
      - name: Build instrumented extension
        run: SKBUILD_CMAKE_DEFINE=CYCDP_COVERAGE=ON uv sync --dev --no-cache

      # tests/test_coverage_setup.py fails here if the instrumentation silently
      # stopped working, rather than letting a misleading number through.
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Catches the unchecked-allocation and out-of-bounds class of bug, which
      # the ordinary suite cannot see: those tests pass cleanly right up until
      # a NULL dereference or overflow takes down the interpreter. This is how
      # the cdp_spectral_time_stretch heap-buffer-overflow was found.
      - name: Build with sanitizers and run tests
        run: make sanitize

  fuzz:
    name: API fuzz (hostile parameters, under ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # The suite and the sanitizer jobs both exercise the library with
      # well-formed input, so between them they validated it against exactly
      # the inputs it was designed for. This drives every public function with
      # NaN, Inf and absurd magnitudes -- the values a caller reaches by typo,
      # or that the CLI produces because argparse accepts "nan" for any float
      # option. It found four segfaults and thirteen hangs when first run.
      #
      # Under ASan so that an out-of-bounds read is a precise report rather
      # than an exit code. Linux only: the harness runs each call in a
      # subprocess and LD_PRELOAD is inherited, where macOS strips DYLD_*.
      - name: Fuzz the API under the sanitizer
        run: make fuzz-sanitize

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Processing calls release the GIL, so they can now genuinely overlap.
      # TSan is the only practical way to validate that: it caught the
      # ctx->prng_state race while the library context was still a shared
      # singleton. ASan cannot detect data races and TSan cannot be combined
      # with it, hence a separate job.
      - name: Build with ThreadSanitizer and run tests
        run: make tsan

  build:
    name: Build (${{ matrix.os }}/${{ matrix.python-version }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Must bracket requires-python (">=3.10"). 3.9 was listed here, below
        # the supported floor: uv honours requires-python and silently resolved
        # a newer interpreter, so the job passed while its name claimed
        # coverage it did not have -- and 3.10, the actual floor, was never
        # built. Keep this as [floor, ceiling] and move both when
        # requires-python moves.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Build extension
        run: uv build --wheel

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  collect-artifacts:
    name: Collect all artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -la all-wheels/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: all-wheels/
          retention-days: 14
